; ESP32-S3 speed test for int8 models (TFLite Micro). Same board settings as ../../node-firmware.
[env:bench]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi   ; octal PSRAM (N16R8): the quad default found no PSRAM
lib_deps = tanakamasayuki/TensorFlowLite_ESP32
build_flags =
    -std=gnu++17
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=0   ; this board is on the UART (bridge) USB port: Serial must be UART0

; Same bench with the other TFLite-Micro port in the registry (the patrol project's second env): newer TFLM, with ESP-NN kernels when the flags below are given.
[env:bench_esptf_ref]
extends = env:bench
lib_deps = nickjgniklu/ESP_TF
build_flags = ${env:bench.build_flags}
    -D USE_ESP_TF

[env:bench_esptf_nn]
extends = env:bench
lib_deps = nickjgniklu/ESP_TF
build_flags = ${env:bench.build_flags}
    -D USE_ESP_TF
    -D ESP_NN
    -D CONFIG_NN_OPTIMIZED
    -D ARCH_ESP32_S3

; Speed test of the MobileNetV3 proxies on the ESP32-S3 gateway board (native USB port, octal PSRAM, 16 MB flash with a 6.5 MB app partition for the 2.7 MB model).
[env:bench_mn]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
upload_port = /dev/cu.usbmodem1101
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.psram = enabled
lib_deps = nickjgniklu/ESP_TF
build_src_filter = -<*> +<../src_mn_main.cpp>
build_flags =
    -std=gnu++17
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D USE_ESP_TF
    -D ESP_NN
    -D CONFIG_NN_OPTIMIZED
    -D ARCH_ESP32_S3

; Same speed test on the node board (ESP32-S3 N16R8 on its UART USB port, octal PSRAM): the settings of the first bench, which are known to work on it.
[env:bench_mn_node]
extends = env:bench_mn
upload_port = /dev/cu.usbmodem5B5E0265961
board_build.arduino.memory_type = qio_opi
build_flags =
    -std=gnu++17
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D USE_ESP_TF
    -D ESP_NN
    -D CONFIG_NN_OPTIMIZED
    -D ARCH_ESP32_S3

; mn04 only, with the 3 MB app partition: tells whether the big model or the partition table made the first build crash at boot.
[env:bench_mn04_node]
extends = env:bench_mn_node
board_build.partitions = huge_app.csv
build_flags =
    ${env:bench_mn_node.build_flags}
    -D ONLY_MN04

; mn10 alone with a 5 MB app partition (partitions_big.csv).
[env:bench_mn10_node]
extends = env:bench_mn_node
board_build.partitions = partitions_big.csv
build_flags =
    ${env:bench_mn_node.build_flags}
    -D ONLY_MN10

; Speed test of the real int8 exports of mn10_as on the node board (11 MB app partition for the two 4.3 and 4.8 MB models).
[env:bench_mnreal_node]
extends = env:bench_mn_node
board_build.partitions = partitions_huge.csv
build_src_filter = -<*> +<../src_mnreal_main.cpp>
board_upload.flash_size = 16MB      ; the board has 16 MB; the board file says 8 MB and esptool refuses a 9.4 MB image

; Per-operation comparison of the board against the computer for the per-channel int8 mn10 (finds the first operation whose result differs).
[env:bench_probe_node]
extends = env:bench_mnreal_node
build_src_filter = -<*> +<../src_probe_main.cpp>

[env:bench_probe_pt_node]
extends = env:bench_probe_node
build_flags =
    ${env:bench_probe_node.build_flags}
    -D PROBE_PT

; Checks the node's C++ audio front end against the numpy reference on the node board, and times it.
[env:bench_frontend_node]
extends = env:bench_mn_node
build_src_filter = -<*> +<../src_frontend_test.cpp>
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB

; The whole classifier path (front end + int8 mn10_as) on the node board.
[env:bench_classifier_node]
extends = env:bench_frontend_node
build_src_filter = -<*> +<../src_classifier_test.cpp>
board_build.partitions = partitions_big.csv
board_build.embed_files = model/acoustic_mn10_int8.tflite
build_flags =
    ${env:bench_frontend_node.build_flags}
    -D TW_ACOUSTIC_MODEL=1

; MAX4466 alone through the ADC digital controller on the node board.
[env:bench_adc_node]
extends = env:bench_frontend_node
build_src_filter = -<*> +<../src_adc_test.cpp>
lib_deps =
