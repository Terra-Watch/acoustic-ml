name: ci
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  compile:
    name: compile every file
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: make check PY=python
      # Syntax errors, undefined names and other mistakes that would crash at run time.
      - run: pip install ruff && ruff check --select E9,F63,F7,F82 src scripts tests
  test:
    name: unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: sudo apt-get update && sudo apt-get install -y libsndfile1
      - run: pip install numpy scipy pandas soundfile librosa scikit-learn pyyaml tqdm pytest
      - run: make test PY=python
